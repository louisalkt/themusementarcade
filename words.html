							<p class="meta"><em>a small etymology and note</em></p>

							<h2>winklepicker</h2>
							<p class="small">(noun) — originally a name for a style of shoe with a sharp pointed toe; delightfully ridiculous, and delightful to say aloud.</p>

							<p>Notes: why winklepicker? Because of the snails, of course.</p>

							<hr>
							<p class="small">Past words: <em>dord</em>, <em>forsooth</em>.</p>
